services:
  - type: web
    name: calculadora-energetica-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: Frontend/calculator-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://calculadora-energetica-back.onrender.com/api
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

